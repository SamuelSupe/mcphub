name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-cli:
    uses: ./.github/workflows/windows-cli.yml

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          gofmt -l ./cmd ./internal | tee /tmp/mcphub-gofmt.txt
          test ! -s /tmp/mcphub-gofmt.txt

      - name: Test with race detector
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Check admin JavaScript syntax
        run: |
          for script in internal/app/adminui/*.js; do
            node --input-type=module --check < "$script"
          done

      - name: Build binaries
        run: |
          go build -trimpath -o ./mcphub ./cmd/mcphub
          go build -trimpath -o ./mcphub-cli ./cmd/mcphub-cli

      - name: Build container
        run: docker build --tag mcphub:ci .
