name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-cli:
    uses: ./.github/workflows/windows-cli.yml

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      vault:
        image: hashicorp/vault:1.21
        env:
          VAULT_DEV_ROOT_TOKEN_ID: mcphub-vault-test-only
          VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
        ports: ["8200:8200"]
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mcphub_test
          POSTGRES_PASSWORD: ci_test_only
          POSTGRES_DB: mcphub_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mcphub_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MCPHUB_TEST_VAULT_ADDR: http://127.0.0.1:8200
      MCPHUB_TEST_VAULT_TOKEN: mcphub-vault-test-only
      MCPHUB_TEST_POSTGRES_DSN: postgres://mcphub_test:ci_test_only@localhost:5432/mcphub_test?sslmode=disable
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          gofmt -l ./cmd ./internal | tee /tmp/mcphub-gofmt.txt
          test ! -s /tmp/mcphub-gofmt.txt

      - name: Test with race detector
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Check browser JavaScript syntax
        run: |
          for script in internal/app/adminui/*.js internal/app/clientportal/*.js; do
            node --input-type=module --check < "$script"
          done

      - name: Build binaries
        run: |
          go build -trimpath -o ./mcphub ./cmd/mcphub
          go build -trimpath -o ./mcphub-cli ./cmd/mcphub-cli

      - name: Build container
        run: docker build --tag mcphub:ci .
