name: Documentation

on:
  push:
    branches: [main]
    paths:
      - "docs-site/**"
      - "docs/**/*.md"
      - "deploy/**/*.md"
      - "deploy/config.*.yaml"
      - "config.example.yaml"
      - "internal/version/version.go"
      - "RELEASE_NOTES_*.md"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs-site/**"
      - "docs/**/*.md"
      - "deploy/**/*.md"
      - "deploy/config.*.yaml"
      - "config.example.yaml"
      - "internal/version/version.go"
      - "RELEASE_NOTES_*.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check documentation JavaScript
        run: node --check docs-site/assets/app.js
      - name: Install documentation build dependency
        run: npm ci --prefix docs-site --ignore-scripts
      - name: Build and validate documentation links
        run: node docs-site/build.mjs
      - name: Upload Pages artifact
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs-site/dist

  deploy:
    if: (github.event_name == 'workflow_dispatch' || github.event_name == 'release') && github.repository == 'SamuelSupe/mcphub'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
