<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">飞书 SSO、Vault 与企业 Agent 接入架构</title>
  <desc id="desc">Codex 和 Claude Code 通过本地连接器及 Broker 访问单活 MCPHub。飞书提供登录身份，目录适配器推送组织快照。MCPHub 检查用户、客户端、工具、业务资源和写审批，再从 Vault 取得独立上游凭证访问业务 endpoint。图中虚线表示待集成的目录适配器或可选的 AWS KMS 自动解封。</desc>
  <defs>
    <marker id="blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#2563eb"/></marker>
    <marker id="teal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#087f75"/></marker>
    <marker id="amber" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#aa690c"/></marker>
    <marker id="gray" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#718096"/></marker>
    <style>
      text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#172b4d}
      .title{font-size:34px;font-weight:700;letter-spacing:.3px}
      .subtitle{font-size:17px;fill:#53647c}
      .zone{font-size:18px;font-weight:650}
      .label{font-size:18px;font-weight:650}
      .body{font-size:15px;fill:#53647c}
      .small{font-size:13px;fill:#63728a}
      .arrow{fill:none;stroke:#2563eb;stroke-width:2.5;stroke-linejoin:round;marker-end:url(#blue)}
      .secret{fill:none;stroke:#087f75;stroke-width:2.5;stroke-linejoin:round;marker-end:url(#teal)}
      .control{fill:none;stroke:#aa690c;stroke-width:2.2;stroke-linejoin:round;marker-end:url(#amber)}
      .optional{fill:none;stroke:#718096;stroke-width:2;stroke-dasharray:6 5;stroke-linejoin:round;marker-end:url(#gray)}
      .storage{fill:none;stroke:#718096;stroke-width:1.8;stroke-linejoin:round;marker-end:url(#gray)}
    </style>
  </defs>
  <rect width="1600" height="1120" fill="#f5f7fb"/>
  <rect x="0" y="0" width="1600" height="8" fill="#2563eb"/>
  <text x="40" y="64" class="title">飞书 SSO × MCPHub × Vault</text>
  <text x="40" y="97" class="subtitle">企业 Agent 接入架构 · 用户登录一次，按客户端授权，写操作独立审批</text>
  <text x="1560" y="61" text-anchor="end" class="small">方案核查：2026-09-26</text>
  <text x="1560" y="85" text-anchor="end" class="small">开发版能力与待集成项见配套文档</text>

  <rect x="32" y="130" width="1536" height="216" rx="18" fill="#fff" stroke="#d7e0ed"/>
  <text x="56" y="165" class="zone">01  人员身份与治理入口</text>
  <rect x="56" y="193" width="274" height="92" rx="12" fill="#f4f7fd" stroke="#c8d7ef"/>
  <text x="76" y="224" class="label">员工 · 系统浏览器</text>
  <text x="76" y="249" class="body">登录 / 连接账号 / 确认 Grant</text>
  <text x="76" y="272" class="small">不填写 Vault Token 或秘密路径</text>
  <rect x="480" y="193" width="260" height="92" rx="12" fill="#eef4ff" stroke="#b9cdf5"/>
  <text x="500" y="224" class="label">飞书 SSO</text>
  <text x="500" y="249" class="body">OAuth 授权码 + PKCE</text>
  <text x="500" y="272" class="small">UserInfo / tenant / 稳定主体</text>
  <path d="M330 236 H480" class="arrow"/>
  <text x="349" y="220" class="small">经 Hub 跳转</text>
  <rect x="800" y="193" width="260" height="92" rx="12" fill="#fffaf0" stroke="#c79b51" stroke-dasharray="6 4"/>
  <text x="820" y="224" class="label">目录适配器 · 待集成</text>
  <text x="820" y="249" class="body">全量分页 / 员工启停 / 部门</text>
  <text x="820" y="272" class="small">独立应用权限和推送密钥</text>
  <path d="M740 239 H800" class="optional"/>
  <rect x="1168" y="193" width="376" height="92" rx="12" fill="#fff6e9" stroke="#e5c799"/>
  <text x="1188" y="224" class="label">管理员 / 独立审批人</text>
  <text x="1188" y="249" class="body">管理门户 · 单独 audience 与角色</text>
  <text x="1188" y="272" class="small">高风险 MFA 需可验证的 OIDC 身份源</text>
  <text x="56" y="321" class="small">飞书真实租户、端点配对及目录同步需验收。</text>

  <rect x="32" y="378" width="338" height="550" rx="18" fill="#fff" stroke="#d7e0ed"/>
  <rect x="408" y="378" width="724" height="550" rx="18" fill="#edf3ff" stroke="#bfd1f0"/>
  <rect x="1168" y="378" width="400" height="550" rx="18" fill="#f0f8f6" stroke="#bfdbd4"/>
  <text x="56" y="412" class="zone">02  员工电脑</text>
  <text x="432" y="412" class="zone">03  MCPHub · 单活 · HTTPS 入口</text>
  <text x="1192" y="412" class="zone">04  私有凭证与业务服务</text>

  <rect x="56" y="450" width="132" height="72" rx="12" fill="#f4f7fd" stroke="#c8d7ef"/>
  <text x="122" y="479" text-anchor="middle" class="label">Codex</text>
  <text x="122" y="502" text-anchor="middle" class="small">独立 client ID</text>
  <rect x="206" y="450" width="140" height="72" rx="12" fill="#f4f7fd" stroke="#c8d7ef"/>
  <text x="276" y="479" text-anchor="middle" class="label">Claude Code</text>
  <text x="276" y="502" text-anchor="middle" class="small">独立 client ID</text>
  <path d="M122 522 V546 H166 V568" class="arrow"/>
  <path d="M276 522 V546 H236 V568" class="arrow"/>
  <rect x="56" y="568" width="290" height="83" rx="12" fill="#eef4ff" stroke="#b9cdf5"/>
  <text x="76" y="599" class="label">mcphub-cli connect</text>
  <text x="76" y="627" class="body">stdio 消息桥接 / 配置不含 Token</text>
  <path d="M201 651 V684" class="arrow"/>
  <rect x="56" y="684" width="290" height="107" rx="12" fill="#e6efff" stroke="#9cbaed"/>
  <text x="76" y="715" class="label">本地 Broker</text>
  <text x="76" y="742" class="body">Hub 登录凭证 / 刷新 / Grant</text>
  <text x="76" y="768" class="body">profile 与连接状态管理</text>
  <text x="56" y="830" class="body">私有 socket / 目录 0700</text>
  <text x="56" y="855" class="body">凭证文件 0600 / 不自动弹登录窗</text>
  <text x="56" y="889" class="small">同一 OS 账号内不构成强进程隔离</text>

  <path d="M610 285 V358 H740 V422 H610 V438" class="arrow"/>
  <rect x="615" y="349" width="133" height="23" rx="4" fill="#f5f7fb"/>
  <text x="620" y="365" class="small">身份验证 / 换码</text>
  <path d="M930 285 V438" class="optional"/>
  <rect x="937" y="349" width="140" height="23" rx="4" fill="#f5f7fb"/>
  <text x="942" y="365" class="small">完整目录快照</text>
  <path d="M1240 285 V359 H1148 V482 H1108" class="control"/>

  <rect x="432" y="438" width="296" height="97" rx="12" fill="#fff" stroke="#b9cdf5"/>
  <text x="452" y="469" class="label">SSO 身份桥接</text>
  <text x="452" y="495" class="body">飞书身份 → Hub 用户 → Hub JWT</text>
  <text x="452" y="518" class="small">MCP / 用户门户 / 管理端独立受众</text>
  <rect x="752" y="438" width="356" height="97" rx="12" fill="#fff" stroke="#b9cdf5"/>
  <text x="772" y="469" class="label">用户与组织 / 治理门户</text>
  <text x="772" y="495" class="body">本地权限 / ClientGrant / 独立审批</text>
  <text x="772" y="518" class="small">新用户待授权 / 工具显式发布</text>

  <path d="M346 738 H388 V644 H432" class="arrow"/>
  <text x="383" y="684" text-anchor="middle" transform="rotate(-90 383 684)" class="small">HTTPS + JWT + Grant</text>
  <path d="M580 535 V590" class="storage"/>
  <path d="M930 535 V562 H770 V590" class="control"/>
  <rect x="432" y="590" width="202" height="117" rx="12" fill="#fff" stroke="#b9cdf5"/>
  <text x="449" y="622" class="label">认证与接纳</text>
  <text x="449" y="650" class="body">JWT / Session / Grant</text>
  <text x="449" y="676" class="body">当前用户状态</text>
  <path d="M634 648 H660" class="arrow"/>
  <rect x="660" y="590" width="218" height="117" rx="12" fill="#fff" stroke="#b9cdf5"/>
  <text x="678" y="622" class="label">逐次授权检查</text>
  <text x="678" y="650" class="body">scope / 工具 / 资源</text>
  <text x="678" y="676" class="body">写审批 / 限流 / 撤销</text>
  <path d="M878 648 H904" class="arrow"/>
  <rect x="904" y="590" width="204" height="117" rx="12" fill="#eaf7f3" stroke="#9cc9bb"/>
  <text x="921" y="622" class="label">上游账号管理</text>
  <text x="921" y="650" class="body">用户 + endpoint 绑定</text>
  <text x="921" y="676" class="body">串行刷新 / 会话隔离</text>

  <path d="M533 707 V761" class="storage"/>
  <path d="M1006 707 V734 H640 V761" class="storage"/>
  <rect x="432" y="761" width="296" height="99" rx="12" fill="#fff" stroke="#b9cdf5"/>
  <text x="452" y="792" class="label">SQLite / PostgreSQL</text>
  <text x="452" y="818" class="body">权限 / Grant / 账号关联 / 审批</text>
  <text x="452" y="842" class="small">schema 8 · 加密元数据 · 单活</text>
  <path d="M770 707 V761" class="storage"/>
  <rect x="752" y="761" width="356" height="99" rx="12" fill="#fff" stroke="#b9cdf5"/>
  <text x="772" y="792" class="label">诊断与审计</text>
  <text x="772" y="818" class="body">主体 / Grant / 审批 / 凭证关联 ID</text>
  <text x="772" y="842" class="small">Token 不入日志 · 长期审计需配置归档</text>
  <text x="432" y="891" class="small">审批恢复前再次检查；凭证失败拒绝调用；不自动重放未知结果的写操作。</text>

  <rect x="1192" y="438" width="352" height="105" rx="12" fill="#fff" stroke="#9cc9bb"/>
  <text x="1212" y="470" class="label">Vault KV v2</text>
  <text x="1212" y="498" class="body">个人 / 共享上游凭证 · AppRole ACL</text>
  <text x="1212" y="524" class="small">Token 保留服务端 / 版本 CAS / 清理队列</text>
  <path d="M1006 590 V565 H1158 V490 H1192" class="secret"/>
  <text x="1020" y="555" class="small">凭证读取与轮换</text>
  <rect x="1192" y="590" width="352" height="117" rx="12" fill="#fff" stroke="#9cc9bb"/>
  <text x="1212" y="622" class="label">私网 MCP endpoints</text>
  <text x="1212" y="650" class="body">项目 / 工单 / 数据库 / 知识服务</text>
  <text x="1212" y="676" class="body">按真实上游账号再次鉴权</text>
  <path d="M1108 648 H1192" class="secret"/>
  <text x="1150" y="635" text-anchor="middle" class="small">MCP</text>
  <rect x="1192" y="761" width="352" height="99" rx="12" fill="#f7faf9" stroke="#96aaa4" stroke-dasharray="6 4"/>
  <text x="1212" y="792" class="label">AWS KMS · 可选</text>
  <text x="1212" y="819" class="body">Vault 自动解封 / 专用 IAM Role</text>
  <text x="1212" y="842" class="small">不替代 Hub 权限或数据库加密密钥</text>
  <path d="M1544 807 H1557 V490 H1544" class="optional"/>
  <text x="1192" y="891" class="small">Vault ACL 控制凭证路径；工具授权由 Hub 执行。</text>

  <rect x="32" y="953" width="1536" height="131" rx="18" fill="#172b4d"/>
  <text x="56" y="986" style="fill:#fff;font-size:19px;font-weight:650">允许执行 = 当前用户权限 ∩ 客户端 Grant ∩ 工具与资源策略 ∩ 必要审批 ∩ 上游实际权限</text>
  <text x="56" y="1017" style="fill:#dce6f6;font-size:15px">令牌分离：飞书登录凭证用于确认身份；Hub JWT + Grant 用于入口授权；Vault 上游凭证只发给指定业务 endpoint。</text>
  <text x="56" y="1045" style="fill:#dce6f6;font-size:15px">业务结果回到 Agent，可能进入模型上下文；数据出境政策、后端访问边界与本机隔离需要同步治理。</text>
  <text x="56" y="1069" style="fill:#aebed6;font-size:13px">实线：主要请求/控制路径　　虚线：目录适配待集成、KMS 可选部署　　完整登录、连接账号与审批时序见说明文档</text>
</svg>
